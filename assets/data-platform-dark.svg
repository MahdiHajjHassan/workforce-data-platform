-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b4c2d8">Reporting measures</text></g><g data-node="datasets"><rect x="252" y="168" width="104" height="64" rx="6" fill="#141c28" stroke="#b4c2d8" stroke-width="1.2"/><text x="304" y="195" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">Downstream</text><text x="304" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">datasets</text></g><g data-node="sharing"><rect x="252" y="280" width="104" height="64" rx="6" fill="#141c28" stroke="#b4c2d8" stroke-width="1.2"/><text x="304" y="307" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">Sharing</text><text x="304" y="327" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">views</text></g><g data-node="dashboards"><rect x="252" y="392" width="104" height="64" rx="6" fill="#141c28" stroke="#b4c2d8" stroke-width="1.2"/><text x="304" y="419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">HR</text><text x="304" y="439" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">dashboards</text></g><text x="304" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b4c2d8">Role + country</text><line x1="40" y1="524" x2="360" y2="524" stroke="#435774"/><text x="40" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#b4c2d8">Common reference architecture</text></svg>
