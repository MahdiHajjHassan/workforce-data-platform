<svg xmlns="http://www.w3.org/2000/svg" id="audience-scope-light-root" viewBox="0 0 400 576" width="400" height="576" role="img" aria-labelledby="audience-scope-light-title audience-scope-light-desc"><title id="audience-scope-light-title">How an audience view is scoped</title><desc id="audience-scope-light-desc">Recipient role, country scope, and an agreed data contract jointly determine permitted records and attributes in an audience-specific view.</desc><defs><marker id="audience-scope-light-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4d617c"/></marker><marker id="audience-scope-light-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#235da1"/></marker></defs><rect width="400" height="576" fill="#f6f8fb"/><path d="M 84 120 L 84 160 Q 84 168 92 168 L 120 168 Q 128 168 128 176 L 128 208" fill="none" stroke="#4d617c" stroke-width="1.5" marker-end="url(#audience-scope-light-arrow)"/><path d="M 192 120 L 192 208" fill="none" stroke="#4d617c" stroke-width="1.5" marker-end="url(#audience-scope-light-arrow)"/><path d="M 308 120 L 308 160 Q 308 168 300 168 L 280 168 Q 272 168 272 176 L 272 208" fill="none" stroke="#4d617c" stroke-width="1.5" marker-end="url(#audience-scope-light-arrow)"/><path d="M 144 272 L 144 296 Q 144 304 136 304 L 120 304 Q 112 304 112 312 L 112 336" fill="none" stroke="#4d617c" stroke-width="1.5" marker-end="url(#audience-scope-light-arrow)"/><path d="M 256 272 L 256 296 Q 256 304 264 304 L 280 304 Q 288 304 288 312 L 288 336" fill="none" stroke="#4d617c" stroke-width="1.5" marker-end="url(#audience-scope-light-arrow)"/><path d="M 112 400 L 112 416 Q 112 424 120 424 L 144 424 Q 152 424 152 432 L 152 448" fill="none" stroke="#4d617c" stroke-width="1.5" marker-end="url(#audience-scope-light-arrow)"/><path d="M 288 400 L 288 416 Q 288 424 280 424 L 256 424 Q 248 424 248 432 L 248 448" fill="none" stroke="#4d617c" stroke-width="1.5" marke