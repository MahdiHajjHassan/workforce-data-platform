f3049">records</text></g><g data-node="fields"><rect x="216" y="336" width="144" height="64" rx="6" fill="#eaf0f8" stroke="#4d617c" stroke-width="1.2"/><text x="288" y="363" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1f3049">Permitted</text><text x="288" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1f3049">attributes</text></g><g data-node="view"><rect x="80" y="448" width="240" height="56" rx="6" fill="#f6f8fb" stroke="#4d617c" stroke-width="1.2"/><text x="200" y="481" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1f3049">Audience-specific view</text></g><line x1="40" y1="524" x2="360" y2="524" stroke="#c8d3e2"/><text x="40" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#4d617c">Both records and attributes are scoped</text></svg>
