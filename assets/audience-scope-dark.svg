</text></g><g data-node="fields"><rect x="216" y="336" width="144" height="64" rx="6" fill="#1d2b3f" stroke="#b4c2d8" stroke-width="1.2"/><text x="288" y="363" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">Permitted</text><text x="288" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">attributes</text></g><g data-node="view"><rect x="80" y="448" width="240" height="56" rx="6" fill="#141c28" stroke="#b4c2d8" stroke-width="1.2"/><text x="200" y="481" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e8eef7">Audience-specific view</text></g><line x1="40" y1="524" x2="360" y2="524" stroke="#435774"/><text x="40" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#b4c2d8">Both records and attributes are scoped</text></svg>
